der:0;background:transparent;width:38px;height:38px;display:grid;place-items:center;padding:8px}.source-summary{display:flex;gap:8px;flex-wrap:wrap;color:var(--color-muted);font-size:14px;margin-top:12px}.source-summary span{padding:4px 7px;border-radius:5px;background:var(--color-accent-soft)}.report-footer{flex:none;padding-top:12px;margin-top:12px;border-top:1px solid var(--color-border)}#exportPdfBtn{width:100%;min-height:44px}.errorbox{color:var(--color-danger);font-size:14px;margin-top:12px}.stage{height:100%;overflow:auto;overscroll-behavior:contain;padding:8px}.page-slot{position:relative;margin:0 auto 20px}.report-wrap{position:absolute;left:0;top:0;transform-origin:top left}.report{width:1600px;height:900px;background:var(--color-surface);color:var(--color-primary);padding:36px 44px;display:grid;grid-template-rows:70px 166px 80px minmax(0,1fr) 100px;gap:18px;border-radius:8px;box-shadow:var(--shadow-card);font-family:'Microsoft JhengHei','Segoe UI',sans-serif}.report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--color-primary);padding-bottom:14px}.report-header h1{font-size:34px;letter-spacing:2px;margin:0}.report-period{text-align:right;font-size:26px;font-weight:600}.report-period small{display:block;font-size:14px;font-weight:400;color:var(--color-muted)}.overview{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:20px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border:1px solid var(--color-border);border-radius:10px;padding:9px 18px;background:var(--color-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}.metric strong{font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}.metric span{font-size:18px}.metric:first-child{background:var(--color-accent-soft);border-color:var(--color-focus)}.rate-panel{border:1px solid var(--color-border);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.rate-ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center}.rate-center{width:90px;height:90px;border-radius:50%;background:var(--color-surface);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}.fees{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fee{display:flex;align-items:center;justify-content:space-between;background:var(--color-accent-soft);border-radius:10px;padding:14px 22px}.fee span{font-size:21px}.fee strong{font-size:33px;font-variant-numeric:tabular-nums}.details-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0}.detail-card{border:1px solid var(--color-border);border-radius:10px;min-height:0;display:flex;flex-direction:column}.detail-card h2{margin:0;padding:12px 16px;background:var(--color-primary);color:var(--color-surface);border-radius:9px 9px 0 0;font-size:21px;display:flex;justify-content:space-between;gap:10px}.detail-card h2 small{font-weight:400;font-size:17px}.detail-body{padding:8px 12px;flex:1;min-height:0}.detail-body table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:17px}.detail-body th{background:var(--color-soft);color:var(--color-muted);font-size:15px;font-weight:500}.detail-body :is(th,td){text-align:left;vertical-align:top;padding:7px 5px;border-bottom:1px solid var(--color-divider);overflow-wrap:anywhere;white-space:pre-wrap}.detail-body td:first-child{font-weight:600}.detail-body td small{display:block;font-weight:400;color:var(--color-muted)}.detail-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--color-muted);font-size:21px}.report-summary{border-top:1px solid var(--color-border);padding-top:10px;min-height:0}.report-summary h2{font-size:20px;margin:0 0 5px}.summary-text{font-size:19px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.preview-panel{min-width:0;min-height:0}.page-index{text-align:center;font-size:13px;color:var(--colo /* Reading order: plan, completion, achievement; then costs and exception details. */
.report{padding:28px 44px;grid-template-rows:64px 150px 66px minmax(0,1fr) 90px;gap:14px}
.report-highlights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.highlight-card{border:1px solid var(--color-border);border-radius:10px;background:var(--color-soft);padding:12px 22px}
.highlight-card:first-child{background:var(--color-accent-soft);border-color:var(--color-focus)}
.highlight-label{font-size:21px;color:var(--color-primary);display:block}
.highlight-number{display:flex;align-items:baseline;gap:10px;line-height:1.3;margin:3px 0 7px}
.highlight-number strong{font-size:44px;font-variant-numeric:tabular-nums}
.highlight-number>span{font-size:19px;color:var(--color-muted)}
.highlight-breakdown{display:flex;gap:28px;font-size:19px;color:var(--color-muted)}
.highlight-breakdown strong{font-size:22px;color:var(--color-primary);margin-left:5px}
.highlight-rate{display:flex;align-items:center;justify-content:center;gap:28px;background:var(--color-surface)}
.highlight-rate .rate-ring{width:118px;height:118px;flex:none}
.highlight-rate .rate-center{width:96px;height:96px;font-size:28px}
.overdue-inline{font-size:20px;margin-top:12px;color:var(--color-muted)}
.overdue-inline strong{color:var(--color-primary);font-size:29px;margin-inline:5px}
.report-secondary{display:grid;grid-template-columns:1fr 1fr .72fr;gap:18px}
.report-secondary .fee{padding:12px 20px}
.report-secondary .fee span{font-size:20px}
.report-secondary .fee strong{font-size:29px}
.report-secondary .change-summary{background:var(--color-soft);border:1px solid var(--color-border)}
.report-detail-stack{display:flex;flex-direction:column;gap:12px;min-height:0}
.report-detail-stack .detail-card{flex:none}
.report-detail-stack .detail-card h2{font-size:20px;padding:7px 16px}
.report-detail-stack .detail-body{padding:0 10px 4px;flex:none}
.report-detail-stack .detail-body table{font-size:20px}
.report-detail-stack .detail-body :is(th,td){padding:5px 7px;line-height:1.3}
.report-detail-stack .detail-body th{font-size:17px}
.report-detail-stack .detail-body td:nth-child(2){font-weight:400}
.detail-empty-row{display:flex;align-items:center;gap:28px;padding:8px 16px;background:var(--color-soft);border:1px solid var(--color-border);border-radius:8px}
.detail-empty-row h2{font-size:20px;margin:0;min-width:210px}
.detail-empty-row>span{color:var(--color-muted);font-size:19px}
.report-editor-group{padding-top:0}
.report-editor-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:16px 0;outline-offset:-2px}
.report-editor-group>summary::-webkit-details-marker{display:none}
.report-editor-group>summary::before{content:'▸';color:var(--color-muted)}
.report-editor-group[open]>summary::before{content:'▾'}
.report-editor-group>summary h2{margin:0;font-size:18px}
.report-editor-group>summary>span{margin-left:auto;font-size:14px;color:var(--color-muted)}
.editor-group-body{overflow:hidden}
.editor-group-body>button{background:var(--color-accent-soft);border-color:transparent;color:var(--color-primary)}


/* Dashboard composition follows the reference; all colors use the existing palette. */
.report.dashboard-report{display:grid;grid-template-rows:135px minmax(0,1fr);gap:18px;padding:26px 32px;background:var(--color-canvas)}
.dashboard-header{position:relative;text-align:center;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);padding:12px 160px}
.dashboard-header h1{font-size:31px;margin:0 0 5px;letter-spacing:2px}
.dashboard-header p{font-size:20px;margin:0;line-height:1.6;color:var(--color-muted)}
.dashboard-header strong{color:var(--color-primary);font-weight:700}
.dashboard-period{position:absolute;right:20px;top:15px;font-size:21px;color:var(--color-muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:148px 220px minmax(0,1fr);gap:16px;min-height:0}
.dashboard-panel{height:100%;min-width:0;min-height:0;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);padding:20px 22px}
.dashboard-panel h2{font-size:21px;margin:0;color:var(--color-primary)}
.dashboard-kpis{grid-column:1/7;grid-row:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dashboard-kpi h2{font-size:19px;font-weight:500}
.dashboard-kpi>strong{display:inline-block;font-size:48px;line-height:1.2;margin-top:14px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.dashboard-kpi>span{font-size:18px;margin-left:7px;color:var(--color-muted)}
.dashboard-kpi strong small{font-size:26px;margin-left:3px}
.dashboard-type{grid-column:7/10;grid-row:1/3;min-height:0}
.dashboard-result{grid-column:10/13;grid-row:1/3;min-height:0}
.distribution-panel{display:flex;flex-direction:column;gap:16px}
.distribution-ring{width:190px;height:190px;flex:0 0 190px;align-self:center;border-radius:50%;display:grid;place-items:center;margin:3px 0}
.distribution-center{width:150px;height:150px;border-radius:50%;background:var(--color-surface);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.distribution-center strong{font-size:31px;font-variant-numeric:tabular-nums}
.distribution-center>span{font-size:16px;color:var(--color-muted)}
.distribution-legend{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:17px}
.distribution-legend>div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 55px;align-items:center;gap:8px}
.legend-marker{width:10px;height:10px;border-radius:2px}
.distribution-legend strong{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.distribution-legend small{font-size:15px;text-align:right;color:var(--color-muted)}
.dashboard-bars{grid-column:1/7;grid-row:2/4;display:flex;flex-direction:column}
.status-bars{display:flex;flex:1;flex-direction:column;justify-content:space-evenly;gap:12px;margin:12px 0}
.status-bar-label{display:flex;justify-content:space-between;align-items:center;font-size:21px;margin-bottom:10px}
.status-bar-label strong{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.status-bar-label small{font-size:17px;font-weight:400;color:var(--color-muted)}
.status-track{height:15px;background:var(--color-muted-surface);border-radius:4px;overflow:hidden}
.status-track>div{height:100%;min-width:0;border-radius:4px}
.bar-footnote{font-size:16px;color:var(--color-muted);padding-top:12px;border-top:1px solid var(--color-divider)}
.dashboard-finance{grid-column:7/13;grid-row:3;display:flex;flex-direction:column;gap:15px}
.dashboard-costs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dashboard-costs>div{background:var(--color-accent-soft);padding:13px 16px;border-radius:8px;min-width:0}
.dashboard-costs span{display:block;font-size:19px;color:var(--color-muted)}
.dashboard-costs strong{font-size:30px;display:block;margin-top:6px;font-variant-numeric:tabular-nums}
.dashboard-notes{min-height:0}
.dashboard-notes h3{margin:0 0 5px;font-size:18px}
.dashboard-notes p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.5;margin:0;color:var(--color-muted)}
.report.report-detail-page{grid-template-rows:64px minmax(0,1fr) 90px}

.status-bar-value{display:flex;align-items:baseline;gap:5px}
</style></head><body class="report-shell"><div class="app">
<section class="controls-panel"><div class="controls"><h1>量測設備校驗管理月報</h1><div class="report-input-scroll"><label for="monthInput">報告月份</label><input id="monthInput" type="month"><div class="source-summary" id="sourceSummary"></div><input type="hidden" id="internalInput"><input type="hidden" id="externalInput"><input type="hidden" id="costInput"><input type="hidden" id="annualInput">
<details class="group report-editor-group" data-editor-type="overdue" open><summary onclick="toggleEditorGroup(event,this)"><h2>逾校_設備明細</h2><span data-editor-count="overdue">0 件</span></summary><div class="editor-group-body"><div id="overdueEditor"></div><button type="button" onclick="addOverdue()">＋ 新增逾校設備</button></div></details>
<details class="group report-editor-group" data-editor-type="ng"><summary onclick="toggleEditorGroup(event,this)"><h2>不合格_設備明細</h2><span data-editor-count="ng">0 件</span></summary><div class="editor-group-body"><div id="ngEditor"></div><button type="button" onclick="addNg()">＋ 新增不合格設備</button></div></details>
<details class="group report-editor-group" data-editor-type="changes"><summary onclick="toggleEditorGroup(event,this)"><h2>異動_設備明細</h2><span data-editor-count="changes">0 件</span></summary><div class="editor-group-body"><div id="changesEditor"></div><button type="button" onclick="addChange()">＋ 新增異動設備</button></div></details>
<section class="group"><h2>總結／其他事項</h2><textarea id="summaryInput" aria-label="總結／其他事項" placeholder="留白時自動產生本月總結"></textarea></section><div id="errorBox" class="errorbox" role="status"></div></div><div class="report-footer"><button id="exportPdfBtn" class="primary" onclick="exportReportPdf()">匯出 PDF</button></div></div></section>
<section class="preview-panel"><div id="stage" class="stage"><div id="pages"></div></div></section></div><div class="notice" id="notice" hidden><div class="notice-card"><h2 id="noticeTitle"></h2><p id="noticeMessage"></p><button type="button" onclick="document.getElementById('notice').hidden=true">確認</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={overdue:[],ng:[],changes:[]},EDITORS={overdue:'overdueEditor',ng:'ngEditor',changes:'changesEditor'},LABELS={overdue:'逾校',ng:'不合格',changes:'異動'};
const CHANGE_TYPES=['新增','限制使用','停用','報廢','其他'],NG_ACTIONS=['停用','送修','複驗','報廢','限制使用','其他'];
const STORES={drafts:'calibrationV41.drafts',history:'calibrationV41.history'};
let appCurrentMonth='',appSuspendDraft=false,source={total:0,internal:0,external:0,cost:0},loading=false;
function localDateISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localMonthISO(){return localDateISO().slice(0,7)}
function fmt(v){return Number(v||0).toLocaleString('en-US')}
function n(id){return Math.max(0,Number($(id).value)||0)}
function readStore(key){try{return JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{return {}}}
function getTotal(){return Number(source.total??(source.internal+source.external))||0}
function getDone(){return Math.max(0,getTotal()-state.overdue.length)}
function getRate(){return getTotal()?getDone()/getTotal()*100:0}
function annualTotal(){return typeof window.appAnnualTotal==='function'?window.appAnnualTotal():Number(source.annual)||0}
function appDefaultRecord(){return {overdue:[],ng:[],changes:[],summary:''}}
function appRecordFromUI(){return {version:2,internal:source.internal,external:source.external,total:getTotal(),cost:source.cost,overdue:structuredClone(state.overdue),ng:structuredClone(state.ng),changes:structuredClone(state.changes),summary:$('summaryInput').value,summaryCustom:$('summaryInput').value}}
function appSaveDraftNow(targetMonth){if(appSuspendDraft||!appCurrentMonth)return;const key=targetMonth||appCurrentMonth,record=appRecordFromUI(),drafts=readStore(STORES.drafts);drafts[key]=record;localStorage.setItem(STORES.drafts,JSON.stringify(drafts));if(typeof window.reportPersistRecord==='function')window.reportPersistRecord(key,record)}
function appSetUIFromRecord(record){for(const type of Object.keys(EDITORS))state[type]=structuredClone(Array.isArray(record?.[type])?record[type]:[]);let summary=record?.summaryCustom??record?.summary??'';if(!summary&&record?.summaryHtml){const el=document.createElement('div');el.innerHTML=record.summaryHtml;summary=el.textContent||''}$('summaryInput').value=summary;renderEditors()}
async function appLoadMonth(key){if(!/^\d{4}-\d{2}$/.test(key))return;if(appCurrentMonth&&appCurrentMonth!==key)appSaveDraftNow();appSuspendDraft=true;appCurrentMonth=key;$('monthInput').value=key;const draft=readStore(STORES.drafts)[key],history=readStore(STORES.history)[key],record=draft||history||(typeof window.reportRecordSource==='function'?window.reportRecordSource(key):null)||appDefaultRecord();appSetUIFromRecord(record);appSuspendDraft=false;update();if(typeof window.reportMonthChanged==='function')window.reportMonthChanged(key)}
function summaryText(){return $('summaryInput').value.trim()||`本月預計校驗 ${fmt(getTotal())} 件，已完成 ${fmt(getDone())} 件，達成率 ${getRate().toFixed(1)}%。合格 ${fmt(Math.max(0,getDone()-state.ng.length))} 件，不合格 ${state.ng.length} 件，逾校 ${state.overdue.length} 件，異動 ${state.changes.length} 件。`}
function trash(){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>'}
function options(values,current){return values.map(value=>`<option ${value===current?'selected':''}>${value}</option>`).join('')}
function field(type,i,key,label,value,inputType='text'){return `<div><label>${label}</label><input aria-label="${label}" type="${inputType}" value="${esc(value)}" data-field="${key}" oninput="bindRow('${type}',${i},'${key}',this.value)"></div>`}
function renderEditors(){const scroller=document.querySelector('.report-input-scroll'),top=scroller.scrollTop;for(const [type,id]of Object.entries(EDITORS))$(id).innerHTML=state[type].map((r,i)=>`<div class="rowcard" data-row="${i}"><div class="grid2">${field(type,i,'code','設備編號',r.code)}${field(type,i,'name','設備名稱',r.name)}${type==='overdue'?`<div><label>類別</label><select aria-label="類別" data-field="type" onchange="bindRow('${type}',${i},'type',this.value)">${options(['內校','外校','遊校'],r.type)}</select></div>${field(type,i,'date','預計完成',r.date,'date')}`:type==='ng'?`<div><label>處置</label><select aria-label="處置" onchange="bindRow('${type}',${i},'action',this.value);renderEditors()">${options(NG_ACTIONS,r.action)}</select></div>`:`<div class="full"><label>異動類型</label><select aria-label="異動類型" onchange="bindRow('${type}',${i},'action',this.value)">${options(CHANGE_TYPES,r.action)}</select></div>`}<div class="full">${field(type,i,'reason',type==='changes'?'異動原因':type==='overdue'?'原因（必填）':'原因',r.reason)}</div>${type==='ng'&&r.action==='其他'?`<div class="full">${field(type,i,'other','其他處置',r.other)}</div>`:''}</div><div class="lookup-note" data-lookup>${lookupMessage(type,i)}</div><div class="actions"><button type="button" class="report-delete-icon" aria-label="刪除${LABELS[type]}設備" onclick="removeRow('${type}',${i})">${trash()}</button></div></div>`).join('');scroller.scrollTop=top}
function lookupMessage(type,i){const r=state[type][i];if(!r.code?.trim())return '';const found=lookup(r.code);return found?'已帶入設備資訊':'清冊無此編號，可自行填寫設備資訊'}
function lookup(code){return typeof window.reportEquipmentSource==='function'?window.reportEquipmentSource(appCurrentMonth,code.trim()):null}

function paginateDetails(capacity=400){
 const makePage=()=>({overdue:[],ng:[],changes:[]});
 const pages=[makePage()];let used=0;
 for(const type of Object.keys(EDITORS)){
  if(!state[type].length){if(used+42>capacity){pages.push(makePage());used=0}pages.at(-1)[type]=null;used+=42;continue}
  for(const row of state[type]){
   const reasonLines=Math.max(1,Math.ceil(String(row.reason||'').length/40));
   const nameLines=Math.max(1,Math.ceil(String(row.name||'').length/18));
   const actionLines=Math.max(1,Math.ceil(String((type==='ng'&&row.action==='其他'?row.other:row.action)||'').length/12));
   const rowHeight=Math.max(reasonLines,nameLines,actionLines,type==='overdue'?2:1)*26+12;
   const heading=pages.at(-1)[type].length?0:78;
   if(used+heading+rowHeight>capacity&&used){pages.push(makePage());used=0}
   const newHeading=pages.at(-1)[type].length?0:78;
   pages.at(-1)[type].push(row);used+=newHeading+rowHeight;
  }
 }
 return pages;
}

function reportDonut(title,segments,center,label){

 const background=total?`conic-gradient(${stops.join(',')})`:'var(--color-border)';
 return `<section class="dashboard-panel distribution-panel"><h2>${title}</h2><div class="distribution-ring" style="background:${background}"><div class="distribution-center"><strong>${esc(center)}</strong><span>${label}</span></div></div><div class="distribution-legend">${segments.map(item=>`<div><span class="legend-marker" style="background:${item.color}"></span><span>${item.label}</span><strong>${fmt(item.value)} 件</strong><small>${total?(item.value/total*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div></section>`;

function toggleEditorGroup(event,summary){
 event.preventDefault();const details=summary.parentElement,body=details.querySelector('.editor-group-body');

function appNotice(title,message){$('noticeTitle').textContent=title;$('noticeMessage').textContent=message;$('notice').hidden=false;return Promise.resolve()}
function getAllCssText(){
  let css='';
  for(const sheet of Array.from(document.styleSheets)){
    try{
      css += Array.from(sheet.cssRules||[]).map(r=>r.cssText).join('\n')+'\n';
    }catch(e){}
  }
  return css;
}
function dataUrlToBytes(dataUrl){
  const b64=dataUrl.split(',')[1];
  const bin=atob(b64);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function asciiBytes(s){return new TextEncoder().encode(s);}
function concatBytes(parts){
  const len=parts.reduce((n,p)=>n+p.length,0);
  const out=new Uint8Array(len); let off=0;
  for(const p of parts){out.set(p,off);off+=p.length;}
  return out;
}
function buildSingleImagePdf(jpegBytes,imgW,imgH,pageW=1600,pageH=900){
  const parts=[]; const offsets=[0]; let pos=0;
  const push=(u)=>{parts.push(u);pos+=u.length;};
  push(asciiBytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  function obj(n,bodyParts){offsets[n]=pos;push(asciiBytes(n+' 0 obj\n'));for(const p of bodyParts)push(typeof p==='string'?asciiBytes(p):p);push(asciiBytes('\nendobj\n'));}
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`,jpegBytes,'\nendstream']);
  const content=`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
  const cb=asciiBytes(content);
  obj(5,[`<< /Length ${cb.length} >>\nstream\n`,cb,'endstream']);
  const xrefPos=pos;
  push(asciiBytes('xref\n0 6\n0000000000 65535 f \n'));
  for(let i=1;i<=5;i++) push(asciiBytes(String(offsets[i]).padStart(10,'0')+' 00000 n \n'));
  push(asciiBytes(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`));
  return new Blob(parts,{type:'application/pdf'});
}
async function renderReportToJpeg(report=$('report')){
  const clone=report.cloneNode(true);
  clone.style.transform='none'; clone.style.margin='0'; clone.style.width='1600px'; clone.style.height='900px';
  const css=getAllCssText();
  const serialized=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><foreignObject width="1600" height="900"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${serialized}</div></foreignObject></svg>`;
  // Important: use a data: URL rather than a blob: URL.
  // Chrome treats SVG foreignObject loaded from blob: as a different/opaque origin,
  // which taints the canvas and makes toDataURL() fail. A self-contained data: URL
  // keeps the rasterized report exportable because all icons are already embedded data URIs.
  const svgDataUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  const img=new Image();
  img.decoding='async';
  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=()=>reject(new Error('報表畫面轉換失敗'));
    img.src=svgDataUrl;
  });
  const scale=1.6;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(1600*scale);
  canvas.height=Math.round(900*scale);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0,1600,900);
  return {dataUrl:canvas.toDataURL('image/jpeg',0.94),w:canvas.width,h:canvas.height};
}
function buildReportPdf(images){
 const parts=[],offsets=[0];let position=0;const push=value=>{const bytes=typeof value==='string'?asciiBytes(value):value;parts.push(bytes);position+=bytes.length},obj=(id,values)=>{offsets[id]=position;push(id+' 0 obj\n');values.forEach(push);push('\nendobj\n')};
 push('%PDF-1.4\n');obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,[`<< /Type /Pages /Kids [${images.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${images.length} >>`]);
 images.forEach((image,i)=>{const id=3+i*3,bytes=dataUrlToBytes(image.dataUrl),content=asciiBytes('q\n960 0 0 540 0 0 cm\n/Im0 Do\nQ\n');obj(id,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 960 540] /Resources << /XObject << /Im0 ${id+1} 0 R >> >> /Contents ${id+2} 0 R >>`]);obj(id+1,[`<< /Type /XObject /Subtype /Image /Width ${image.w} /Height ${image.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`,bytes,'\nendstream']);obj(id+2,[`<< /Length ${content.length} >>\nstream\n`,content,'endstream'])});const start=position;push(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);offsets.slice(1).forEach(offset=>push(String(offset).padStart(10,'0')+' 00000 n \n'));push(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})
}
async function exportReportPdf(){const errors=validate();if(errors.length)return appNotice('請確認月報資料',errors.join('\n'));const button=$('exportPdfBtn');button.disabled=true;button.textContent='匯出中…';try{update();appSaveDraftNow();await document.fonts.ready;const images=[];for(const report of document.querySelectorAll('.report'))images.push(await renderReportToJpeg(report));const pdf=buildReportPdf(images),url=URL.createObjectURL(pdf),link=document.createElement('a');link.href=url;link.download='量測設備校驗管理月報_'+appCurrentMonth.replace('-','')+'.pdf';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){appNotice('PDF 匯出失敗',e.message)}finally{button.disabled=false;button.textContent='匯出 PDF'}}
