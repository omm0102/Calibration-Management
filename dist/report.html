/* Reading order: plan, completion, achievement; then costs and exception details. */
.report{padding:28px 44px;grid-template-rows:64px 150px 66px minmax(0,1fr) 90px;gap:14px}
.report-highlights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.highlight-card{border:1px solid var(--color-border);border-radius:10px;background:var(--color-soft);padding:12px 22px}
.highlight-card:first-child{background:var(--color-accent-soft);border-color:var(--color-focus)}
.highlight-label{font-size:21px;color:var(--color-primary);display:block}
.highlight-number{display:flex;align-items:baseline;gap:10px;line-height:1.3;margin:3px 0 7px}
.highlight-number strong{font-size:44px;font-variant-numeric:tabular-nums}
.highlight-number>span{font-size:19px;color:var(--color-muted)}
.highlight-breakdown{display:flex;gap:28px;font-size:19px;color:var(--color-muted)}
.highlight-breakdown strong{font-size:22px;color:var(--color-primary);margin-left:5px}
.highlight-rate{display:flex;align-items:center;justify-content:center;gap:28px;background:var(--color-surface)}
.highlight-rate .rate-ring{width:118px;height:118px;flex:none}
.highlight-rate .rate-center{width:96px;height:96px;font-size:28px}
.overdue-inline{font-size:20px;margin-top:12px;color:var(--color-muted)}
.overdue-inline strong{color:var(--color-primary);font-size:29px;margin-inline:5px}
.report-secondary{display:grid;grid-template-columns:1fr 1fr .72fr;gap:18px}
.report-secondary .fee{padding:12px 20px}
.report-secondary .fee span{font-size:20px}
.report-secondary .fee strong{font-size:29px}
.report-secondary .change-summary{background:var(--color-soft);border:1px solid var(--color-border)}
.report-detail-stack{display:flex;flex-direction:column;gap:12px;min-height:0}
.report-detail-stack .detail-card{flex:none}
.report-detail-stack .detail-card h2{font-size:20px;padding:7px 16px}
.report-detail-stack .detail-body{padding:0 10px 4px;flex:none}
.report-detail-stack .detail-body table{font-size:20px}
.report-detail-stack .detail-body :is(th,td){padding:5px 7px;line-height:1.3}
.report-detail-stack .detail-body th{font-size:17px}
.report-detail-stack .detail-body td:nth-child(2){font-weight:400}
.detail-empty-row{display:flex;align-items:center;gap:28px;padding:8px 16px;background:var(--color-soft);border:1px solid var(--color-border);border-radius:8px}
.detail-empty-row h2{font-size:20px;margin:0;min-width:210px}
.detail-empty-row>span{color:var(--color-muted);font-size:19px}
.report-editor-group{padding-top:0}
.report-editor-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:16px 0;outline-offset:-2px}
.report-editor-group>summary::-webkit-details-marker{display:none}
.report-editor-group>summary::before{content:'▸';color:var(--color-muted)}
.report-editor-group[open]>summary::before{content:'▾'}
.report-editor-group>summary h2{margin:0;font-size:18px}
.report-editor-group>summary>span{margin-left:auto;font-size:14px;color:var(--color-muted)}
.editor-group-body{overflow:hidden}
.editor-group-body>button{background:var(--color-accent-soft);border-color:transparent;color:var(--color-primary)}


/* Dashboard composition follows the reference; all colors use the existing palette. */
.report.dashboard-report{display:grid;grid-template-rows:135px minmax(0,1fr);gap:18px;padding:26px 32px;background:var(--color-canvas)}
.dashboard-header{position:relative;text-align:center;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);padding:12px 160px}
.dashboard-header h1{font-size:31px;margin:0 0 5px;letter-spacing:2px}
.dashboard-header p{font-size:20px;margin:0;line-height:1.6;color:var(--color-muted)}
.dashboard-header strong{color:var(--color-primary);font-weight:700}
.dashboard-period{position:absolute;right:20px;top:15px;font-size:21px;color:var(--color-muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:148px 220px minmax(0,1fr);gap:16px;min-height:0}
.dashboard-panel{height:100%;min-width:0;min-height:0;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);padding:20px 22px}
.dashboard-panel h2{font-size:21px;margin:0;color:var(--color-primary)}
.dashboard-kpis{grid-column:1/7;grid-row:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dashboard-kpi h2{font-size:19px;font-weight:500}
.dashboard-kpi>strong{display:inline-block;font-size:48px;line-height:1.2;margin-top:14px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.dashboard-kpi>span{font-size:18px;margin-left:7px;color:var(--color-muted)}
.dashboard-kpi strong small{font-size:26px;margin-left:3px}
.dashboard-type{grid-column:7/10;grid-row:1/3;min-height:0}
.dashboard-result{grid-column:10/13;grid-row:1/3;min-height:0}
.distribution-panel{display:flex;flex-direction:column;gap:16px}
.distribution-ring{width:190px;height:190px;flex:0 0 190px;align-self:center;border-radius:50%;display:grid;place-items:center;margin:3px 0}
.distribution-center{width:150px;height:150px;border-radius:50%;background:var(--color-surface);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.distribution-center strong{font-size:31px;font-variant-numeric:tabular-nums}
.distribution-center>span{font-size:16px;color:var(--color-muted)}
.distribution-legend{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:17px}
.distribution-legend>div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 55px;align-items:center;gap:8px}
.legend-marker{width:10px;height:10px;border-radius:2px}
.distribution-legend strong{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.distribution-legend small{font-size:15px;text-align:right;color:var(--color-muted)}
.dashboard-bars{grid-column:1/7;grid-row:2/4;display:flex;flex-direction:column}
.status-bars{display:flex;flex:1;flex-direction:column;justify-content:space-evenly;gap:12px;margin:12px 0}
.status-bar-label{display:flex;justify-content:space-between;align-items:center;font-size:21px;margin-bottom:10px}
.status-bar-label strong{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.status-bar-label small{font-size:17px;font-weight:400;color:var(--color-muted)}
.status-track{height:15px;background:var(--color-muted-surface);border-radius:4px;overflow:hidden}
.status-track>div{height:100%;min-width:0;border-radius:4px}
.bar-footnote{font-size:16px;color:var(--color-muted);padding-top:12px;border-top:1px solid var(--color-divider)}
.dashboard-finance{grid-column:7/13;grid-row:3;display:flex;flex-direction:column;gap:15px}
.dashboard-costs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dashboard-costs>div{background:var(--color-accent-soft);padding:13px 16px;border-radius:8px;min-width:0}
.dashboard-costs span{display:block;font-size:19px;color:var(--color-muted)}
.dashboard-costs strong{font-size:30px;display:block;margin-top:6px;font-variant-numeric:tabular-nums}
.dashboard-notes{min-height:0}
.dashboard-notes h3{margin:0 0 5px;font-size:18px}
.dashboard-notes p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.5;margin:0;color:var(--color-muted)}
.report.report-detail-page{grid-template-rows:64px minmax(0,1fr) 90px}

.status-bar-value{display:flex;align-items:baseline;gap:5px}

/* All metrics and equipment details share a single 16:9 report page. */
.report.single-report{position:relative;display:grid;grid-template-rows:125px minmax(0,1fr);gap:16px;padding:24px 30px;background:var(--color-canvas)}
.single-report-grid{display:grid;grid-template-columns:minmax(0,1fr) 355px;grid-template-rows:122px minmax(0,1fr);gap:14px;min-height:0}
.single-kpis{grid-column:1;grid-row:1;grid-template-columns:repeat(3,minmax(0,1fr))}
.single-kpis .dashboard-kpi{padding:14px 20px}
.single-kpis .dashboard-kpi>strong{margin-top:5px;font-size:45px}
.single-details{grid-column:1;grid-row:2;min-height:0}
.single-details-content{display:flex;flex-direction:column;gap:12px}
.single-details-content .detail-card{flex:none;background:var(--color-surface)}
.single-details-content .detail-card h2{font-size:21px;padding:8px 14px}
.single-details-content .detail-body{padding:0 10px 5px}
.single-details-content .detail-body table{font-size:20px}
.single-details-content .detail-body :is(th,td){padding:6px;line-height:1.3}
.single-details-content .detail-body th{font-size:17px}
.single-sidebar{grid-column:2;grid-row:1/3;display:grid;grid-template-rows:310px 83px 83px minmax(0,1fr);gap:12px;min-height:0}
.single-sidebar .distribution-panel{padding:16px 20px;gap:6px}
.single-sidebar .distribution-ring{width:140px;height:140px;flex-basis:140px;margin:0}
.single-sidebar .distribution-center{width:110px;height:110px}
.single-sidebar .distribution-center strong{font-size:27px}
.single-sidebar .distribution-center>span{font-size:15px}
.single-sidebar .distribution-legend{gap:6px;font-size:16px}
.single-fee{border:1px solid var(--color-border);border-radius:10px;background:var(--color-accent-soft);padding:10px 18px}
.single-fee>span{display:block;font-size:18px;color:var(--color-muted)}
.single-fee>strong{display:block;font-size:29px;line-height:1.4;font-variant-numeric:tabular-nums}
.single-notes{padding:14px 18px;min-height:0}
.single-notes h2{font-size:19px;margin:0 0 8px}
.single-notes p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.5;margin:0;color:var(--color-muted)}


/* Return to the original three-column monthly report with navy title bands. */
.report.classic-report{display:grid;position:relative;grid-template-rows:102px minmax(0,1fr) 124px;gap:16px;padding:18px;background:var(--color-surface);color:var(--color-primary)}
.classic-report-header{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
.classic-title-line{display:flex;align-items:center;gap:24px}
.classic-title-line>span{flex:1;height:4px;background:var(--color-primary)}
.classic-title-line h1{margin:0;font-size:40px;letter-spacing:3px;white-space:nowrap}
.classic-period{font-size:27px;font-weight:600}
.classic-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;min-height:0}
.classic-column{display:grid;gap:16px;min-height:0}
.classic-first-column{grid-template-rows:minmax(0,1.05fr) minmax(0,1fr)}
.classic-middle-column{grid-template-rows:268px minmax(0,1fr)}
.classic-last-column{min-height:0}
.classic-card{border:3px solid var(--color-primary);border-radius:22px;background:var(--color-surface);min-height:0;display:flex;flex-direction:column}
.classic-card>h2{display:flex;justify-content:center;align-items:center;gap:15px;border-radius:17px 17px 0 0;margin:0;padding:10px 12px;background:var(--color-primary);color:var(--color-surface);font-size:27px;font-weight:500;line-height:1.25;flex:none}
.classic-card>h2 small{font-size:18px;font-weight:400}
.classic-overview-body{padding:18px;display:flex;flex-direction:column;justify-content:space-around;flex:1;min-height:0}
.classic-total{display:flex;justify-content:center;gap:24px;align-items:center}
.classic-total>div>span{display:block;font-size:24px}
.classic-total strong{font-size:57px;line-height:1.3;display:block;font-variant-numeric:tabular-nums}
.classic-total strong small{font-size:23px;font-weight:400}
.classic-type-counts{display:grid;grid-template-columns:1fr 1fr;gap:15px;border-top:1px solid var(--color-border);padding-top:12px;text-align:center}
.classic-type-counts>div>span{display:block;color:var(--color-muted);font-size:22px}
.classic-type-counts strong{font-size:37px;font-variant-numeric:tabular-nums;margin-right:8px}
.classic-type-counts small{font-size:20px}
.classic-cost-body{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0;padding:8px 20px}
.classic-cost-body>div{position:relative;padding:6px 12px;text-align:center}
.classic-cost-body>div+div{border-top:1px solid var(--color-border);padding-top:10px}
.classic-cost-body svg{position:absolute;left:0;top:8px;width:45px;height:45px}
.classic-cost-body span{display:block;font-size:23px;color:var(--color-muted)}
.classic-cost strong{display:block;font-size:43px;font-variant-numeric:tabular-nums;line-height:1.4}
.classic-result-body{display:grid;grid-template-columns:minmax(0,1fr) 155px;align-items:center;gap:10px;flex:1;min-height:0;padding:14px 16px}
.classic-done>span{font-size:22px;display:block}
.classic-done>strong{font-size:54px;display:block;font-variant-numeric:tabular-nums;line-height:1.3}
.classic-done>strong small{font-size:21px;font-weight:400}
.classic-result-counts{display:flex;gap:13px;font-size:19px;margin-top:10px}
.classic-result-counts b{font-size:23px;margin-left:4px}
.classic-rate{text-align:center}
.classic-rate-ring{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px}
.classic-rate-ring>div{width:117px;height:117px;display:grid;place-items:center;background:var(--color-surface);border-radius:50%;font-size:28px;font-weight:700}
.classic-rate>span{font-size:20px}
.classic-fit{flex:1;min-height:0;padding:10px 8px}
.classic-detail-content .detail-empty{height:100%}
.classic-detail-content table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:21px}
.classic-detail-content :is(th,td){padding:6px 5px;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap;border-bottom:1px solid var(--color-border);line-height:1.3}
.classic-detail-content th{font-weight:500;background:var(--color-soft);color:var(--color-muted);font-size:18px}
.classic-detail-content td small{display:block;font-size:.85em;color:var(--color-muted)}
.classic-empty{font-size:25px;color:var(--color-muted);text-align:center;padding:30px 8px}
.classic-summary>h2{padding:6px 12px;font-size:25px}
.classic-summary-body{min-height:0;flex:1;padding:8px 18px}
.classic-summary-body p{margin:0;font-size:23px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}

.classic-detail-content col:nth-child(1){width:24%!important}
.classic-detail-content col:nth-child(2){width:26%!important}
.classic-detail-content col:nth-child(3){width:30%!important}
.classic-detail-content col:nth-child(4){width:20%!important}
.classic-detail-content td small{font-size:15px;white-space:nowrap}

/* Two rows of three equal cards, with centered contents. */
.classic-columns{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:18px 20px}
.classic-overview-body{justify-content:center;gap:15px;padding:14px 18px}
.classic-type-counts{width:100%}
.classic-result-body{justify-content:center;align-items:center;text-align:center}
.classic-result-counts{justify-content:center}
.classic-done{text-align:center}
.classic-fit{display:flex;align-items:center;justify-content:center}
.classic-detail-content{width:100%}
.classic-detail-content :is(th,td){text-align:center}
.classic-empty{padding:0 8px;text-align:center}
.classic-cost-body{justify-content:center;gap:8px;text-align:center}
.classic-cost-body>div{width:100%;padding:5px 12px}
.classic-cost-body svg{top:50%;transform:translateY(-50%)}


/* User-defined composition: header, three summaries, three tables, then conclusion. */
.report.airy-report{padding:24px;grid-template-rows:84px minmax(0,1fr) 100px;gap:16px}
.airy-report .classic-report-header{gap:5px}
.airy-report .classic-report-header h1{font-size:35px;letter-spacing:2px;margin:0}
.airy-report .classic-period{font-size:23px;color:var(--color-muted)}
.airy-report .classic-columns{grid-template-rows:230px minmax(0,1fr);gap:18px}
.airy-report .classic-card{border:1px solid var(--color-border);border-radius:12px}
.airy-report .classic-card>h2{border-radius:11px 11px 0 0;font-size:23px;line-height:1.35;background:var(--color-accent-soft);color:var(--color-primary);padding:12px 16px;justify-content:space-between}
.airy-report .classic-card>h2 small{font-size:18px;color:var(--color-muted)}
.airy-report .overview-box{padding:16px 22px;align-items:center;justify-content:center;gap:5px}
.airy-report .overview-box>h2{background:none;border-radius:0;justify-content:center;padding:0;font-size:23px;font-weight:500}
.overview-total{display:flex;align-items:baseline;justify-content:center;gap:10px}
.overview-total strong{font-size:53px;line-height:1.25;font-variant-numeric:tabular-nums}
.overview-total>span{color:var(--color-muted);font-size:20px}
.overview-breakdown{display:grid;grid-template-columns:1fr 1fr;width:100%;border-top:1px solid var(--color-divider);padding-top:9px;margin-top:4px;text-align:center}
.overview-breakdown>div:first-child{border-right:1px solid var(--color-divider)}
.overview-breakdown span{display:block;font-size:19px;color:var(--color-muted)}
.overview-breakdown strong{font-size:30px;line-height:1.3;margin-right:6px;font-variant-numeric:tabular-nums}
.overview-breakdown small{font-size:17px;color:var(--color-muted)}
.airy-report .results-box{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;gap:22px;padding:20px 22px}
.results-ring{text-align:center;font-size:19px;color:var(--color-muted)}
.results-ring .classic-rate-ring{width:155px;height:155px;margin-bottom:8px}
.results-ring .classic-rate-ring>div{width:125px;height:125px;font-size:29px}
.results-numbers{display:flex;flex-direction:column;gap:10px}
.results-numbers>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--color-divider)}
.results-numbers>div:last-child{border-bottom:0;padding-bottom:0}
.results-numbers span{font-size:20px;color:var(--color-muted)}
.results-numbers strong{font-size:31px;font-variant-numeric:tabular-nums}
.airy-report .costs-box{padding:14px 22px;justify-content:center;gap:8px}
.airy-report .costs-box>h2{background:none;justify-content:center;font-weight:500;padding:0;font-size:23px}
.cost-figure{width:100%;text-align:center}
.cost-figure>span{display:block;font-size:18px;color:var(--color-muted)}
.airy-report .cost-figure>strong{font-size:34px;line-height:1.3}
.annual-figure{border-top:1px solid var(--color-divider);padding-top:7px}
.airy-report .classic-fit{padding:16px 10px}
.airy-report .classic-detail-content table{font-size:20px}
.airy-report .classic-detail-content th{font-size:17px;background:var(--color-soft)}
.airy-report .classic-detail-content :is(th,td){padding:8px 5px;border-color:var(--color-divider)}
.airy-report .classic-empty{font-size:23px}
.airy-report .classic-summary{display:grid;grid-template-columns:115px minmax(0,1fr);align-items:stretch}
.airy-report .classic-summary>h2{border-radius:11px 0 0 11px;justify-content:center;padding:12px;background:var(--color-accent-soft);font-size:23px}
.airy-report .classic-summary-body{display:flex;align-items:center;padding:12px 20px}
.airy-report .classic-summary-body p{font-size:21px;line-height:1.5}


/* Monthly report palette: existing navy and white only. */
.airy-report{color:var(--color-primary);background:var(--color-surface)}
.airy-report .classic-card{border-color:var(--color-primary);background:var(--color-surface)}
.airy-report .classic-card>h2,.airy-report .classic-summary>h2{background:var(--color-primary);color:var(--color-surface)}
.airy-report .classic-card>h2 small{color:var(--color-surface)}
.airy-report .overview-box>h2{background:var(--color-surface);color:var(--color-primary)}
.airy-report :is(.classic-period,.overview-total>span,.overview-breakdown span,.overview-breakdown small,.results-ring,.results-numbers span,.cost-figure>span,.classic-empty){color:var(--color-primary)}
.airy-report .overview-breakdown,.airy-report .overview-breakdown>div:first-child,.airy-report .results-numbers>div,.airy-report .annual-figure{border-color:var(--color-primary)}
.airy-report .classic-detail-content :is(th,td){text-align:left;border:1px solid var(--color-primary);background:var(--color-surface);color:var(--color-primary)}
.airy-report .classic-detail-content th{background:var(--color-primary);color:var(--color-surface);font-weight:500}
.airy-report .classic-detail-content td small{color:var(--color-primary)}
.airy-report .classic-detail-content table{border:1px solid var(--color-primary)}

.airy-report .classic-detail-content th:not(:last-child){border-right-color:var(--color-surface)}
.report-input-scroll{padding:6px 16px 10px 6px}
#summaryInput{min-height:220px;line-height:1.6}
.summary-editor-hint{font-size:13px;color:var(--color-muted);margin-bottom:8px;line-height:1.5}
</style></head><body class="report-shell"><div class="app">
<section class="controls-panel"><div class="controls"><h1>量測設備校驗管理月報</h1><div class="report-input-scroll"><label for="monthInput">報告月份</label><input id="monthInput" type="month"><input type="hidden" id="internalInput"><input type="hidden" id="externalInput"><input type="hidden" id="costInput"><input type="hidden" id="annualInput">

<section class="preview-panel"><div id="stage" class="stage"><div id="pages"></div></div></section></div><div class="notice" id="notice" hidden><div class="notice-card"><h2 id="noticeTitle"></h2><p id="noticeMessage"></p><button type="button" onclick="document.getElementById('notice').hidden=true">確認</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={overdue:[],ng:[],changes:[]},EDITORS={overdue:'overdueEditor',ng:'ngEditor',changes:'changesEditor'},LABELS={overdue:'逾校',ng:'不合格',changes:'異動'};

let summaryNotes='',summaryAutoText='';
let appCurrentMonth='',appSuspendDraft=false,source={total:0,internal:0,external:0,cost:0},loading=false;
function localDateISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localMonthISO(){return localDateISO().slice(0,7)}
function fmt(v){return Number(v||0).toLocaleString('en-US')}
function n(id){return Math.max(0,Number($(id).value)||0)}
function readStore(key){try{return JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{return {}}}

function appDefaultRecord(){return {overdue:[],ng:[],changes:[],summary:''}}
function appRecordFromUI(){return {version:2,internal:source.internal,external:source.external,total:getTotal(),cost:source.cost,overdue:structuredClone(state.overdue),ng:structuredClone(state.ng),changes:structuredClone(state.changes),summary:summaryText(),summaryCustom:summaryNotes,summaryNotes,summaryRulesVersion:1}}
function appSaveDraftNow(targetMonth){if(appSuspendDraft||!appCurrentMonth)return;const key=targetMonth||appCurrentMonth,record=appRecordFromUI(),drafts=readStore(STORES.drafts);drafts[key]=record;localStorage.setItem(STORES.drafts,JSON.stringify(drafts));if(typeof window.reportPersistRecord==='function')window.reportPersistRecord(key,record)}
function appSetUIFromRecord(record){for(const type of Object.keys(EDITORS))state[type]=structuredClone(Array.isArray(record?.[type])?record[type]:[]);summaryNotes=migrateSummaryNotes(record);summaryAutoText='';$('summaryInput').value='';renderEditors()}
async function appLoadMonth(key){if(!/^\d{4}-\d{2}$/.test(key))return;if(appCurrentMonth&&appCurrentMonth!==key)appSaveDraftNow();appSuspendDraft=true;appCurrentMonth=key;$('monthInput').value=key;const draft=readStore(STORES.drafts)[key],history=readStore(STORES.history)[key],record=draft||history||(typeof window.reportRecordSource==='function'?window.reportRecordSource(key):null)||appDefaultRecord();appSetUIFromRecord(record);appSuspendDraft=false;update();if(typeof window.reportMonthChanged==='function')window.reportMonthChanged(key)}
function summaryReasonText(items){const reasons=[...new Set(items.map(r=>(r.reason||'').trim()).filter(Boolean))];if(!reasons.length)return '原因待補充';if(reasons.length<3)return reasons.join('、');return reasons.slice(0,-1).join('、')+'及'+reasons.at(-1)}
function summaryActionText(items){const actions=[...new Set(items.map(r=>r.action==='其他'?(r.other||'').trim():(r.action||'').trim()).filter(Boolean))];if(!actions.length)return '後續處置';if(actions.length<3)return actions.join('、');return actions.slice(0,-1).join('、')+'及'+actions.at(-1)}
function buildOverduePhrase(){
 const count=state.overdue.length;if(!count)return '本月無逾校設備。';
 const groups={內校:[],外校:[],遊校:[]};for(const row of state.overdue)if(groups[row.type])groups[row.type].push(row);
 const active=Object.entries(groups).filter(([,rows])=>rows.length);
 const detail=active.length===1?`目前逾校 ${count} 件，主要原因為${summaryReasonText(active[0][1])}。`:`目前逾校 ${count} 件，其中${active.map(([type,rows])=>`${type} ${rows.length} 件，主要原因為${summaryReasonText(rows)}`).join('；')}。`;
 const actions=[];if(groups.外校.length)actions.push('持續追蹤外校案件進度並加強交期提醒');if(groups.內校.length)actions.push('強化內校設備排程管理及校驗進度追蹤');if(groups.遊校.length)actions.push('加強遊校排程與現場協調');
 const improve=actions.length===1?actions[0]:actions.length===2?actions.join('，同時'):actions[0]+'，同時'+actions[1]+'，並'+actions[2];

function buildNgPhrase(){
 const count=state.ng.length;if(!count)return '本月無校驗不合格設備。';

 return count===1?`本月共有 1 件設備校驗不合格，主要原因為${reasons}，目前已採取${actions}處置。`:`本月共有 ${count} 件設備校驗不合格，主要原因包含${reasons}，目前已依個別狀況採取${actions}等處置。`;
}
function buildChangePhrase(){
 const count=state.changes.length;if(!count)return '本月無設備異動。';
 const groups=CHANGE_TYPES.map(type=>[type,state.changes.filter(r=>r.action===type)]).filter(([,rows])=>rows.length);
 return `本月設備異動共 ${count} 件：${groups.map(([type,rows])=>`${type} ${rows.length} 件（${summaryReasonText(rows)}）`).join('；')}。`;
}
function defaultSummaryText(){return `本月應校驗設備共 ${fmt(getTotal())} 件，已完成 ${fmt(getDone())} 件，校驗達成率為 ${getRate().toFixed(1)}%。${buildOverduePhrase()}${buildNgPhrase()}${buildChangePhrase()}`}
function migrateSummaryNotes(record){
 if(typeof record?.summaryNotes==='string')return record.summaryNotes;
 let text=record?.summaryCustom??record?.summary??'';
 if(!text&&record?.summaryHtml){const div=document.createElement('div');div.innerHTML=record.summaryHtml;text=div.textContent||''}
 // Old records stored generated sentences and user notes together. Keep the notes,
 // and rebuild recognized generated sentences from the current month's detail data.
 return (String(text).match(/[^。\n]+[。\n]?/g)||[]).filter(sentence=>{
  const start=sentence.trim();
  return !/^(?:本月(?:應校驗|預計校驗|無(?:校驗)?不合格設備|無逾校設備|有(?:校驗)?不合格設備|有逾校設備|無設備異動|設備異動共|共有\s*\d+\s*件設備校驗不合格)|目前逾校|後續將|合格\s*[\d,]+\s*件|不合格\s*[\d,]+\s*件|逾校\s*[\d,]+\s*件|異動\s*[\d,]+\s*件)/.test(start);

}
function refreshSummaryEditor(){
 const editor=$('summaryInput'),old=summaryAutoText,start=editor.selectionStart,end=editor.selectionEnd,focused=document.activeElement===editor;
 summaryAutoText=defaultSummaryText()+'\n';const combined=summaryAutoText+summaryNotes;
 if(editor.value!==combined){editor.value=combined;if(focused){const shift=summaryAutoText.length-old.length;editor.setSelectionRange(Math.max(summaryAutoText.length,start+shift),Math.max(summaryAutoText.length,end+shift))}}
}
function summaryText(){return defaultSummaryText()+(summaryNotes?'\n'+summaryNotes:'')}
function onSummaryInput(){
 const value=$('summaryInput').value;
 summaryNotes=value.startsWith(summaryAutoText)?value.slice(summaryAutoText.length):migrateSummaryNotes({summary:value});

}
function trash(){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>'}
function options(values,current){return values.map(value=>`<option ${value===current?'selected':''}>${value}</option>`).join('')}
function field(type,i,key,label,value,inputType='text'){return `<div><label>${label}</label><input aria-label="${label}" type="${inputType}" value="${esc(value)}" data-field="${key}" oninput="bindRow('${type}',${i},'${key}',this.value)"></div>`}
function renderEditors(){const scroller=document.querySelector('.report-input-scroll'),top=scroller.scrollTop;for(const [type,id]of Object.entries(EDITORS))$(id).innerHTML=state[type].map((r,i)=>`<div class="rowcard" data-row="${i}"><div class="grid2">${field(type,i,'code','設備編號',r.code)}${field(type,i,'name','設備名稱',r.name)}${type==='overdue'?`<div><label>類別</label><select aria-label="類別" data-field="type" onchange="bindRow('${type}',${i},'type',this.value)">${options(['內校','外校','遊校'],r.type)}</select></div>${field(type,i,'date','預計完成',r.date,'date')}`:type==='ng'?`<div><label>處置</label><select aria-label="處置" onchange="bindRow('${type}',${i},'action',this.value);renderEditors()">${options(NG_ACTIONS,r.action)}</select></div>`:`<div class="full"><label>異動類型</label><select aria-label="異動類型" onchange="bindRow('${type}',${i},'action',this.value)">${options(CHANGE_TYPES,r.action)}</select></div>`}<div class="full">${field(type,i,'reason',type==='changes'?'異動原因':type==='overdue'?'原因（必填）':'原因',r.reason)}</div>${type==='ng'&&r.action==='其他'?`<div class="full">${field(type,i,'other','其他處置',r.other)}</div>`:''}</div><div class="lookup-note" data-lookup>${lookupMessage(type,i)}</div><div class="actions"><button type="button" class="report-delete-icon" aria-label="刪除${LABELS[type]}設備" onclick="removeRow('${type}',${i})">${trash()}</button></div></div>`).join('');scroller.scrollTop=top}
function lookupMessage(type,i){const r=state[type][i];if(!r.code?.trim())return '';const found=lookup(r.code);return found?'已帶入設備資訊':'清冊無此編號，可自行填寫設備資訊'}
function lookup(code){return typeof window.reportEquipmentSource==='function'?window.reportEquipmentSource(appCurrentMonth,code.trim()):null}
function bindRow(type,i,key,value){const r=state[type][i];r[key]=value;if(key==='code'){const equipment=lookup(value);if(equipment){Object.assign(r,{name:equipment.name,asset:equipment.asset,unit:equipment.unit,owner:equipment.owner});if(type==='overdue')r.type=equipment.type;const card=$(EDITORS[type]).querySelector(`[data-row="${i}"]`);for(const k of ['name','type']){const input=card?.querySelector(`[data-field="${k}"]`);if(input)input.value=r[k]||''}}const note=$(EDITORS[type]).querySelector(`[data-row="${i}"] [data-lookup]`);if(note)note.textContent=lookupMessage(type,i)}update();appSaveDraftNow()}
function animateRow(element,remove=false){if(!element)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){if(remove)element.remove();return}const height=element.getBoundingClientRect().height;const frames=[{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginBottom:'0px',opacity:0},{height:height+'px',paddingTop:'12px',paddingBottom:'12px',marginBottom:'12px',opacity:1}];const animation=element.animate(remove?frames.reverse():frames,{duration:200,easing:'ease',fill:remove?'forwards':'none'});if(remove)animation.onfinish=()=>element.remove()}
function addItem(type,value){const group=$(EDITORS[type]).closest('details');group._animation?.cancel();delete group._target;group.open=true;state[type].push(value||{code:'',name:'',reason:'',...(type==='overdue'?{type:'內校',date:localDateISO()}:type==='ng'?{action:'停用',other:''}:{action:'新增'})});renderEditors();update();appSaveDraftNow();animateRow($(EDITORS[type]).lastElementChild)}
function addOverdue(value){addItem('overdue',value)}function addNg(value){addItem('ng',value)}function addChange(value){addItem('changes',value)}
function removeRow(type,i){const editor=$(EDITORS[type]),card=editor.querySelector(`[data-row="${i}"]`),ghost=card?.cloneNode(true),scroller=document.querySelector('.report-input-scroll'),top=scroller.scrollTop;state[type].splice(i,1);renderEditors();if(ghost){ghost.inert=true;ghost.setAttribute('aria-hidden','true');editor.insertBefore(ghost,editor.children[i]||null);animateRow(ghost,true)}scroller.scrollTop=top;update();appSaveDraftNow()}
function validate(){const issues=[];if(state.overdue.length>getTotal())issues.push('逾校件數不可大於預計校驗總數');if(state.ng.length>getDone())issues.push('不合格件數不可大於本月已校驗完成件數');for(const type of Object.keys(EDITORS)){const seen=new Set();state[type].forEach((r,i)=>{if(!r.code?.trim()||!r.name?.trim()||!r.reason?.trim()||(type==='overdue'&&!r.date)||(type==='ng'&&r.action==='其他'&&!r.other?.trim()))issues.push(`${LABELS[type]}第 ${i+1} 筆資料尚未完整`);if(r.code?.trim()&&seen.has(r.code.trim()))issues.push(`${LABELS[type]}設備編號 ${r.code} 重複`);seen.add(r.code?.trim())})}return issues}
function detailTable(type,items){
 return `<table><colgroup><col style="width:17%"><col style="width:23%"><col style="width:40%"><col style="width:20%"></colgroup><thead><tr><th>設備編號</th><th>設備名稱</th><th>${type==='changes'?'異動原因':'原因'}</th><th>${type==='overdue'?'類別／預計完成':type==='ng'?'處置':'異動類型'}</th></tr></thead><tbody>${items.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.reason)}</td><td>${type==='overdue'?esc(r.type)+'<small>'+esc(r.date)+'</small>':esc(type==='ng'&&r.action==='其他'?r.other:r.action)}</td></tr>`).join('')}</tbody></table>`;
}
function reportDonut(title,segments,center,label){
 const total=segments.reduce((sum,item)=>sum+item.value,0);let angle=0;
 const stops=segments.filter(item=>item.value>0).map(item=>{const start=angle;angle+=item.value/total*360;return `${item.color} ${start}deg ${angle}deg`});
 const background=total?`conic-gradient(${stops.join(',')})`:'var(--color-border)';
 return `<section class="dashboard-panel distribution-panel"><h2>${title}</h2><div class="distribution-ring" style="background:${background}"><div class="distribution-center"><strong>${esc(center)}</strong><span>${label}</span></div></div><div class="distribution-legend">${segments.map(item=>`<div><span class="legend-marker" style="background:${item.color}"></span><span>${item.label}</span><strong>${fmt(item.value)} 件</strong><small>${total?(item.value/total*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div></section>`;

function dataUrlToBytes(dataUrl){

  return out;
}

async function renderReportToJpeg(report=$('report')){

  clone.style.transform='none'; clone.style.margin='0'; clone.style.width='1600px'; clone.style.height='900px';
  const css=getAllCssText();

  img.decoding='async';
  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=()=>reject(new Error('報表畫面轉換失敗'));
    img.src=svgDataUrl;
  });

  const canvas=document.createElement('canvas');

  canvas.height=Math.round(900*scale);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0,1600,900);

}
