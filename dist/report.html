'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function summaryText(){return $('summaryInput').value.trim()||`本月預計校驗 ${fmt(getTotal())} 件，已完成 ${fmt(getDone())} 件，達成率 ${getRate().toFixed(1)}%。合格 ${fmt(Math.max(0,getDone()-state.ng.length))} 件，不合格 ${state.ng.length} 件，逾校 ${state.overdue.length} 件，異動 ${state.changes.length} 件。`}

function animateRow(element,remove=false){if(!element)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){if(remove)element.remove();return}const height=element.getBoundingClientRect().height;const frames=[{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginBottom:'0px',opacity:0},{height:height+'px',paddingTop:'12px',paddingBottom:'12px',marginBottom:'12px',opacity:1}];const animation=element.animate(remove?frames.reverse():frames,{duration:200,easing:'ease',fill:remove?'forwards':'none'});if(remove)animation.onfinish=()=>element.remove()}

function validate(){const issues=[];if(state.overdue.length>getTotal())issues.push('逾校件數不可大於預計校驗總數');if(state.ng.length>getDone())issues.push('不合格件數不可大於本月已校驗完成件數');for(const type of Object.keys(EDITORS)){const seen=new Set();state[type].forEach((r,i)=>{if(!r.code?.trim()||!r.name?.trim()||!r.reason?.trim()||(type==='overdue'&&!r.date)||(type==='ng'&&r.action==='其他'&&!r.other?.trim()))issues.push(`${LABELS[type]}第 ${i+1} 筆資料尚未完整`);if(r.code?.trim()&&seen.has(r.code.trim()))issues.push(`${LABELS[type]}設備編號 ${r.code} 重複`);seen.add(r.code?.trim())})}return issues}

function renderPreview(){const scroll=$('stage').scrollTop,pages={overdue:paginate(state.overdue),ng:paginate(state.ng),changes:paginate(state.changes)},summary=summaryText(),summaryParts=summary.match(/[\s\S]{1,280}/g)||[''],count=Math.max(summaryParts.length,...Object.values(pages).map(a=>a.length)),rate=getRate();const metrics=[['預計校驗總數',getTotal(),'totalText'],['內校',source.internal,'internalText'],['外校',source.external,'externalText'],['本月已校驗完成',getDone(),'doneText'],['合格',Math.max(0,getDone()-state.ng.length),'passText'],['不合格',state.ng.length,'failText'],['逾校件數',state.overdue.length,'overdueCountText'],['異動件數',state.changes.length,'changeCountText']];$('pages').innerHTML=Array.from({length:count},(_,i)=>`<div class="page-slot"><div class="report-wrap"><article class="report" ${i?'':'id="report"'}><header class="report-header"><h1>量測設備校驗管理月報</h1><div class="report-period">${esc(appCurrentMonth.replace('-',' / '))}</div></header><section class="overview"><div class="metric-grid">${metrics.map(([label,value,id])=>`<div class="metric"><span>${label}</span><strong ${i?'':`id="${id}"`}>${fmt(value)}</strong></div>`).join('')}</div><div class="rate-panel"><span>達成率</span><div class="rate-ring" style="background:conic-gradient(var(--color-primary) ${Math.min(100,rate)*3.6}deg,var(--color-border) 0)"><div class="rate-center" ${i?'':'id="rateCenter"'}>${rate.toFixed(1)}%</div></div></div></section><section class="fees"><div class="fee"><span>外校費用</span><strong ${i?'':'id="costText"'}>NT$ ${fmt(source.cost)}</strong></div><div class="fee"><span>年度費用</span><strong ${i?'':'id="annualText"'}>NT$ ${fmt(annualTotal())}</strong></div></section><section class="details-grid">${Object.keys(EDITORS).map(type=>`<section class="detail-card"><h2>${LABELS[type]}_設備明細<small>${state[type].length} 件</small></h2><div class="detail-body">${detailTable(type,pages[type][i]||[],i)}</div></section>`).join('')}</section><section class="report-summary"><h2>總結／其他事項${i?'（續）':''}</h2><div class="summary-text">${esc(summaryParts[i]||'')}</div></section></article></div></div>`).join('');fitPreview();$('stage').scrollTop=scroll;document.querySelectorAll('.detail-body').forEach(body=>{let size=17;while(body.scrollHeight>body.clientHeight+1&&size>10){size--;body.querySelectorAll('td,th').forEach(e=>e.style.fontSize=size+'px')}})}

function getAllCssText(){

function dataUrlToBytes(dataUrl){

  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

async function renderReportToJpeg(report=$('report')){

  const css=getAllCssText();

    img.src=svgDataUrl;
  });

  canvas.height=Math.round(900*scale);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0,1600,900);

}
