*{box-sizing:border-box}

.danger{background:var(--color-danger-soft);color:var(--color-danger-hover)}

.errorbox{display:none;margin-top:12px;border:1px solid var(--color-danger-tint);background:var(--color-danger-soft);color:var(--color-danger-hover);border-radius:9px;padding:10px;font-size:13px;line-height:1.6}

#printHost{display:none}
@media print{
  /* Keep the printed/PDF page itself at the same 16:9 ratio as the report.
     Chromium/Edge otherwise falls back to A4/Letter landscape (about 1.41:1),
     which preserves the snapshot but leaves large white bands and makes the report look undersized. */
  @page{size:13.333in 7.5in;margin:0}
  html,body{margin:0!important;padding:0!important;background:var(--color-surface)!important;width:13.333in!important;height:7.5in!important;overflow:hidden!important}
  body > .app{display:none!important}
  #printHost{display:block!important;position:fixed!important;left:0!important;top:0!important;width:13.333in!important;height:7.5in!important;margin:0!important;padding:0!important;overflow:hidden!important;background:var(--color-surface)!important}
  #printHost img{display:block!important;width:13.333in!important;height:7.5in!important;max-width:none!important;max-height:none!important;object-fit:fill!important;object-position:0 0!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

<script>
const $=id=>document.getElementById(id);
const state={overdue:[], ng:[]};
function n(id){return Math.max(0, Number($(id).value||0));}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(v){return Number(v||0).toLocaleString('en-US');}
function localDateISO(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function localMonthISO(){return localDateISO().slice(0,7);}
function monthLabel(){const v=$('monthInput').value||localMonthISO(); const [y,m]=v.split('-'); return `${y}/${Number(m)}`;}
function mmdd(v){if(!v)return '';const d=new Date(v+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`;}
function addOverdue(d){state.overdue.push(d||{code:'',name:'',type:'內校',reason:'',date:localDateISO()});renderEditors();update();}
function addNg(d){state.ng.push(d||{code:'',name:'',reason:'',action:'停用'});renderEditors();update();}
function removeRow(type,i){state[type].splice(i,1);renderEditors();update();}
function bindRow(type,i,key,val){state[type][i][key]=val;update();}
function renderEditors(){
 $('overdueEditor').innerHTML=state.overdue.map((r,i)=>`<div class="rowcard"><div class="grid2">
 <div><label>設備編號</label><input value="${esc(r.code)}" oninput="bindRow('overdue',${i},'code',this.value)"></div>
 <div><label>設備名稱</label><input value="${esc(r.name)}" oninput="bindRow('overdue',${i},'name',this.value)"></div>
 <div><label>類別</label><select onchange="bindRow('overdue',${i},'type',this.value)">${['內校','外校','遊校'].map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label>預計完成</label><input type="date" value="${esc(r.date)}" oninput="bindRow('overdue',${i},'date',this.value)"></div>
 </div><div style="margin-top:8px"><label>原因（必填）</label><input value="${esc(r.reason)}" oninput="bindRow('overdue',${i},'reason',this.value)" placeholder="請輸入詳細原因"></div><div class="actions"><button class="danger" onclick="removeRow('overdue',${i})">刪除</button></div></div>`).join('');
 $('ngEditor').innerHTML=state.ng.map((r,i)=>`<div class="rowcard"><div class="grid2">
 <div><label>設備編號</label><input value="${esc(r.code)}" oninput="bindRow('ng',${i},'code',this.value)"></div>
 <div><label>設備名稱</label><input value="${esc(r.name)}" oninput="bindRow('ng',${i},'name',this.value)"></div>

 state.overdue.forEach(r=>{if(groups[r.type])groups[r.type].push(r);});
 const active=Object.entries(groups).filter(([,arr])=>arr.length);
 let detail='';
 if(active.length===1){
   const [type,arr]=active[0];
   detail=`目前逾校 ${count} 件，主要原因為${summaryReasonText(arr)}。`;
 }else{
   const parts=active.map(([type,arr])=>`${type} ${arr.length} 件，主要原因為${summaryReasonText(arr)}`);
   detail=`目前逾校 ${count} 件，其中${parts.join('；')}。`;
 }
 const hasExt=groups.外校.length>0, hasInt=groups.內校.length>0, hasVisit=groups.遊校.length>0;
 const actions=[];
 if(hasExt) actions.push('持續追蹤外校案件進度並加強交期提醒');
 if(hasInt) actions.push('強化內校設備排程管理及校驗進度追蹤');

function chooseLayout(){
 const report=$('report');
 report.classList.remove('layout-left-ng','layout-split','layout-ng-right');
 const ow=state.overdue.length, ng=state.ng.length;

 // Special case: many NG items but at most one overdue item.
 // Put NG on the full right column and the small overdue card below the result card.
 if(ng>=3 && ow<=1){
   report.classList.add('layout-ng-right');
   return;
 }

 // Existing rules:
 // - NG >= 2 OR overdue <= 3: stack overdue + NG in the right column.
 // - Otherwise: overdue uses the full right column and NG stays below result.
 const useSplit = (ng>=2 || ow<=3);
 if(useSplit){
   report.classList.add('layout-split');
   const totalH=556, gap=16, usable=totalH-gap;
   const owRows=Math.max(1,ow), ngRows=Math.max(1,ng);
   const owNeed=92 + owRows*36;
   const ngNeed=92 + ngRows*36;
   let owH=Math.round(usable * owNeed/(owNeed+ngNeed));
   const owMin=ow===0?170:(ow<=2?190:210);
   const ngMin=ng===0?170:(ng<=2?190:210);
   owH=Math.max(owMin, Math.min(usable-ngMin, owH));
   let ngH=usable-owH;
   if(ngH<ngMin){ngH=ngMin;owH=usable-ngH;}
   report.style.setProperty('--split-overdue-h',owH+'px');
   report.style.setProperty('--split-ng-top',(143+owH+gap)+'px');
   report.style.setProperty('--split-ng-h',ngH+'px');
 }else{
   report.classList.add('layout-left-ng');
 }
}
function fitTableFont(table, rows, maxHeight){
  // Fit font and row height to the REAL shell size. The table should feel full, not float at the top.
  const shell=table.parentElement;
  const isSplit=$('report').classList.contains('layout-split');
  const isOverdue=table.classList.contains('overdue-table');
  const slots=Math.max(1,rows)+1; // header + rows
  const available=Math.max(60,maxHeight-2);
  const targetFill=isSplit?0.98:(isOverdue?0.90:0.94);
  const targetTableH=Math.floor(available*targetFill);
  let rowH=Math.max(28,Math.floor(targetTableH/slots));
  let fs=Math.min(20,Math.max(9,Math.floor(rowH*0.34)));
  if(rows<=2) fs=Math.min(20,Math.max(fs,17));
  if(rows===3) fs=Math.min(18,Math.max(fs,15));
  const cells=[...table.querySelectorAll('th,td')];
  const trs=[...table.querySelectorAll('tr')];
  const apply=()=>{
    cells.forEach(x=>{x.style.fontSize=fs+'px';x.style.padding='2px 4px';x.style.lineHeight='1.10';});
    trs.forEach(x=>x.style.height=rowH+'px');
  };
  apply();
  let guard=0;
  while(table.getBoundingClientRect().height>available && guard++<40){
    if(fs>9) fs-=0.5;
    rowH=Math.max(24,rowH-1);
    apply();
  }
  // Final row-height variables are also exposed for CSS/print consistency.
  if(isSplit){
    if(isOverdue) $('report').style.setProperty('--split-overdue-row-h',rowH+'px');
    else $('report').style.setProperty('--split-ng-row-h',rowH+'px');
  } else if(isOverdue){
    $('report').style.setProperty('--overdue-row-h',rowH+'px');
    $('report').style.setProperty('--overdue-table-h',Math.min(targetTableH,available)+'px');
  }
  return fs;
}

function fitOverviewNumbers(){

    const el=$(id);

    if(digits===3) return 36;

  });

  ids.forEach(id=>{ const el=$(id); if(el) el.style.fontSize=fs+'px'; });

function fitSummaryFont(){
  const el=$('summaryText'); if(!el) return;
  const text=el.textContent||'';
  const boxW=el.clientWidth, boxH=el.clientHeight;
  if(!boxW||!boxH) return;
  // Measure text in an auto-height clone because scrollHeight on a fixed-height box cannot reveal under-fill.
  const probe=document.createElement('div');
  probe.style.cssText=`position:fixed;left:-99999px;top:0;width:${boxW}px;height:auto;visibility:hidden;white-space:normal;word-break:break-word;font-family:${getComputedStyle(el).fontFamily};font-weight:${getComputedStyle(el).fontWeight};letter-spacing:${getComputedStyle(el).letterSpacing};`;
  probe.textContent=text;
  document.body.appendChild(probe);
  const measure=(fs)=>{probe.style.fontSize=fs+'px';probe.style.lineHeight='1.38';return probe.getBoundingClientRect().height;};
  // Aim for roughly 78% of the available height while never overflowing 96%.
  let best=18;
  for(let fs=18;fs<=34;fs+=0.5){
    const h=measure(fs);
    if(h<=boxH*0.96){best=fs;} else break;
  }
  // If the content is still visually too short, prefer a larger fit rather than leaving dead space.
  while(best<34 && measure(best)<boxH*0.72 && measure(best+0.5)<=boxH*0.96) best+=0.5;
  document.body.removeChild(probe);
  el.style.fontSize=best+'px';
  el.style.lineHeight='1.38';
}

function dataUrlToBytes(dataUrl){
  const b64=dataUrl.split(',')[1];
  const bin=atob(b64);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function asciiBytes(s){return new TextEncoder().encode(s);}
function concatBytes(parts){
  const len=parts.reduce((n,p)=>n+p.length,0);
  const out=new Uint8Array(len); let off=0;
  for(const p of parts){out.set(p,off);off+=p.length;}
  return out;
}
function buildSingleImagePdf(jpegBytes,imgW,imgH,pageW=1600,pageH=900){
  const parts=[]; const offsets=[0]; let pos=0;
  const push=(u)=>{parts.push(u);pos+=u.length;};
  push(asciiBytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  function obj(n,bodyParts){offsets[n]=pos;push(asciiBytes(n+' 0 obj\n'));for(const p of bodyParts)push(typeof p==='string'?asciiBytes(p):p);push(asciiBytes('\nendobj\n'));}
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`,jpegBytes,'\nendstream']);
  const content=`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
  const cb=asciiBytes(content);
  obj(5,[`<< /Length ${cb.length} >>\nstream\n`,cb,'endstream']);
  const xrefPos=pos;
  push(asciiBytes('xref\n0 6\n0000000000 65535 f \n'));
  for(let i=1;i<=5;i++) push(asciiBytes(String(offsets[i]).padStart(10,'0')+' 00000 n \n'));
  push(asciiBytes(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`));
  return new Blob(parts,{type:'application/pdf'});
}
async function renderReportToJpeg(){
  const report=$('report');
  const clone=report.cloneNode(true);
  clone.style.transform='none'; clone.style.margin='0'; clone.style.width='1600px'; clone.style.height='900px';
  const css=getAllCssText();
  const serialized=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><foreignObject width="1600" height="900"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${serialized}</div></foreignObject></svg>`;
  // Important: use a data: URL rather than a blob: URL.
  // Chrome treats SVG foreignObject loaded from blob: as a different/opaque origin,
  // which taints the canvas and makes toDataURL() fail. A self-contained data: URL
  // keeps the rasterized report exportable because all icons are already embedded data URIs.
  const svgDataUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  const img=new Image();
  img.decoding='async';
  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=()=>reject(new Error('報表畫面轉換失敗'));
    img.src=svgDataUrl;
  });
  const scale=1.6;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(1600*scale);
  canvas.height=Math.round(900*scale);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0,1600,900);
  return {dataUrl:canvas.toDataURL('image/jpeg',0.94),w:canvas.width,h:canvas.height};
}

async function exportReportPdf(){
 const errors=validate();
 if(errors.length){await appNotice('資料驗證未通過','請先修正紅色提示。');return}

  link.href=url;link.download=currentPrintTitle()+'.pdf';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

  update();
}
function appDefaultRecord(){return {internal:0,external:0,cost:0,overdue:[],ng:[],summaryHtml:'',summary:''};}
function appSaveDraftNow(targetMonth){
  if(appSuspendDraft||appMode==='readonly')return;
  const key=targetMonth||appMonthKey(); if(!key)return;
  appDraftCache[key]=appRecordFromUI();
  if(typeof window.reportDataSource==='function')Object.assign(appDraftCache[key],window.reportDataSource(key));
  appWriteStore(APP_V41_KEYS.drafts,appDraftCache);
  if(typeof window.reportPersistRecord==='function')window.reportPersistRecord(key,appDraftCache[key]);
}
function appDeleteDraft(key){delete appDraftCache[key];appWriteStore(APP_V41_KEYS.drafts,appDraftCache);}
function appAnnualTotal(){
  const key=appMonthKey(); const [ys,ms]=(key||'').split('-'); const y=Number(ys), m=Number(ms);
  if(!y||!m)return n('costInput');
  let total=(y===2026 && m>=10)?Number(APP_OPENING_EXTERNAL_COST[2026]||0):0;
  for(const [k,rec] of Object.entries({...appHistoryCache,...appDraftCache})){
    const [hy,hm]=k.split('-').map(Number);
    if(hy===y && hm<m) total+=Number(rec?.cost||0);
  }
  total+=n('costInput');
  return Math.max(0,total);
}

function appSetReadonly(flag){
  const panel=document.querySelector('.controls-panel');
  panel.classList.toggle('app-readonly',flag);
  const selector='#internalInput,#externalInput,#costInput,#overdueEditor input,#overdueEditor select,#ngEditor input,#ngEditor select';
  panel.querySelectorAll(selector).forEach(el=>el.disabled=flag||(typeof window.reportDataSource==='function'&&['internalInput','externalInput','costInput'].includes(el.id)));
  $('summaryInput').setAttribute('contenteditable',flag?'false':'true');
  panel.querySelectorAll('.group > button.secondary[onclick^="add"],#overdueEditor .danger,#ngEditor .danger').forEach(el=>el.disabled=flag);
}
function appApplyMode(){
 appMode='auto';appSetReadonly(false);
 const actionbar=document.querySelector('.app-actionbar');if(actionbar)actionbar.classList.remove('app-editing-mode');
}

function appShowLoading(show){
  const el=$('appLoadingLayer'); if(!el)return;
  if(show){el.classList.add('app-visible');el.setAttribute('aria-hidden','false');}
  else{el.classList.remove('app-visible');el.setAttribute('aria-hidden','true');}
}
function appDelay(ms){return new Promise(r=>setTimeout(r,ms));}
function appToast(msg){const el=$('appToast');el.textContent=msg;el.classList.add('app-visible');clearTimeout(appToast._t);appToast._t=setTimeout(()=>el.classList.remove('app-visible'),1500);}
function appModal({title,message,buttons}){
  return new Promise(resolve=>{
    const layer=$('appModalLayer'), actions=$('appModalActions');
    $('appModalTitle').textContent=title||'提示'; $('appModalMessage').textContent=message||''; actions.innerHTML='';
    buttons.forEach(b=>{const btn=document.createElement('button');btn.type='button';btn.textContent=b.label;btn.className=b.primary?'app-modal-btn-primary':'app-modal-btn-secondary';btn.onclick=()=>{layer.classList.remove('app-visible');layer.setAttribute('aria-hidden','true');setTimeout(()=>resolve(b.value),120);};actions.appendChild(btn);});
    layer.classList.add('app-visible');layer.setAttribute('aria-hidden','false');
  });
}
function appNotice(title,message){return appModal({title,message,buttons:[{label:'確認',value:true,primary:true}]});}

async function appLoadMonth(key,{animate=true}={}){
  if(!key)return;
  const request=(appLoadMonth.request||0)+1;appLoadMonth.request=request;
  // Preserve current editable draft before leaving the month.
  if(appCurrentMonth && appCurrentMonth!==key && appMode!=='readonly') appSaveDraftNow(appCurrentMonth);
  appRefreshCaches();
  const hist=appHistoryCache[key];
  const draft=appDraftCache[key];
  if(hist && animate){appShowLoading(true);await appDelay(260);}
  if(request!==appLoadMonth.request)return;
  appCurrentMonth=key;
  appSuspendDraft=true;
  $('monthInput').value=key;
  if(draft){appSetUIFromRecord(draft);appApplyMode('auto');}
  else if(hist){appSetUIFromRecord(hist);appApplyMode('auto');}
  else{appSetUIFromRecord((typeof window.reportRecordSource==='function'&&window.reportRecordSource(key))||appDefaultRecord());appApplyMode('new');}
  appSuspendDraft=false;
  update();
  if(typeof window.reportMonthChanged==='function')window.reportMonthChanged(key);
  if(hist && animate)await appDelay(160);
  if(request===appLoadMonth.request)appShowLoading(false);
}

async function appSaveReport(){
  const errs=validate();
  if(errs.length){await appNotice('資料驗證未通過',errs.join('\n'));return;}
  const key=appMonthKey(); appRefreshCaches();
  const record=appRecordFromUI();
  if(appHistoryCache[key] && appMode==='editing'){
    const ans=await appModal({title:'確認更新月報',message:`${key.replace('-', '/')} 已有儲存資料，是否以目前內容取代原資料？`,buttons:[{label:'取消',value:false},{label:'確認取代',value:true,primary:true}]});
    if(!ans)return;
  }else if(appHistoryCache[key] && appMode!=='editing'){
    await appNotice('月份已儲存',`${key.replace('-', '/')} 已有歷史資料，請先按「修改」後再變更。`);return;
  }
  appHistoryCache[key]=record; appWriteStore(APP_V41_KEYS.history,appHistoryCache); appDeleteDraft(key);
  if(typeof window.reportPersistRecord==='function')window.reportPersistRecord(key,record);
  appSetUIFromRecord(record); appApplyMode('readonly'); appToast('月報已儲存'); update();
}
async function appBeginEdit(){
  if(!appHistoryCache[appMonthKey()])return;
  appApplyMode('editing'); appToast('已進入修改模式');
}
async function appCancelEdit(){
  const key=appMonthKey();
  const ans=await appModal({title:'取消修改',message:'目前尚未儲存的修改將會放棄，是否繼續？',buttons:[{label:'繼續修改',value:false},{label:'放棄修改',value:true,primary:true}]});
  if(!ans)return;
  appRefreshCaches(); if(appHistoryCache[key]) appSetUIFromRecord(appHistoryCache[key]); appApplyMode('readonly');
}

function appExportJson(){
  appRefreshCaches(); if(appMode!=='readonly')appSaveDraftNow();
  const payload={version:1,exportedAt:new Date().toISOString(),history:appHistoryCache,drafts:appDraftCache};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(), y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  a.download=`量測設備校驗月報備份_${y}${m}${day}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),800);
}
async function appImportJsonFile(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){await appNotice('匯入失敗','JSON 檔案格式無法讀取。');return;}
  if(!data || Number(data.version)!==1 || typeof data.history!=='object' || typeof data.drafts!=='object'){
    await appNotice('匯入失敗','這不是可識別的月報備份檔案。');return;
  }
  appRefreshCaches();
  const nextHist=appClone(appHistoryCache), nextDraft=appClone(appDraftCache);
  for(const [key,rec] of Object.entries(data.history||{})){
    if(nextHist[key]){
      const ans=await appModal({title:'發現重複資料',message:`${key.replace('-', '/')} 已存在資料。`,buttons:[{label:'取消匯入',value:'cancel'},{label:'保留目前資料',value:'keep'},{label:'使用匯入資料',value:'replace',primary:true}]});
      if(ans==='cancel')return; if(ans==='replace')nextHist[key]=rec;
    }else nextHist[key]=rec;
  }
  for(const [key,rec] of Object.entries(data.drafts||{})){
    if(!nextHist[key]) nextDraft[key]=rec;
  }
  appHistoryCache=nextHist;appDraftCache=nextDraft;appWriteStore(APP_V41_KEYS.history,nextHist);appWriteStore(APP_V41_KEYS.drafts,nextDraft);
  await appLoadMonth(appMonthKey(),{animate:!!nextHist[appMonthKey()]}); appToast('備份資料已匯入');
}

// Wrap row mutations so drafts follow every edit without changing V37 report behavior.
const appV41OldAddOverdue=addOverdue, appV41OldAddNg=addNg, appV41OldRemoveRow=removeRow, appV41OldBindRow=bindRow;
addOverdue=function(d){appV41OldAddOverdue(d);if(appMode!=='readonly')appSaveDraftNow();};
addNg=function(d){appV41OldAddNg(d);if(appMode!=='readonly')appSaveDraftNow();};
removeRow=function(type,i){appV41OldRemoveRow(type,i);if(appMode!=='readonly')appSaveDraftNow();};
bindRow=function(type,i,key,val){appV41OldBindRow(type,i,key,val);if(appMode!=='readonly')appSaveDraftNow();};

function appInitV41(){
  appRefreshCaches();
  // Make the legacy manual annual field irrelevant; annualTotal() now delegates to appAnnualTotal().
  $('annualInput').value=0;
  appCurrentMonth=$('monthInput').value||localMonthISO();
  $('monthInput').addEventListener('change',async e=>{const key=e.target.value||localMonthISO();await appLoadMonth(key,{animate:true});});
  ['internalInput','externalInput','costInput'].forEach(id=>$(id).addEventListener('input',()=>{if(appMode!=='readonly')appSaveDraftNow();}));
  $('summaryInput').addEventListener('input',()=>{if(appMode!=='readonly')appSaveDraftNow();});
  // Close modal only through explicit action buttons to avoid accidental loss.
  appLoadMonth(appCurrentMonth,{animate:false});
}
requestAnimationFrame(()=>requestAnimationFrame(appInitV41));
</script>

<div class="app-modal-layer" id="appModalLayer" aria-hidden="true">
  <div class="app-modal-card" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
    <div class="app-modal-head" id="appModalTitle"></div>
    <div class="app-modal-body" id="appModalMessage"></div>
    <div class="app-modal-actions" id="appModalActions"></div>
  </div>
</div>
<div class="app-loading-layer" id="appLoadingLayer" aria-hidden="true">
  <div class="app-loading-box"><span class="app-loading-spinner"></span><span>讀取月報資料</span></div>
</div>
<div class="app-toast" id="appToast"></div>
</body></html>
